<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ララランド | 公式サイト</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 目に優しくポップなダークカラーパレット */
            --bg-main: #161324;
            --card-bg: #221c36;
            --card-bg-hover: #2a2342;
            --text-main: #f5f3ff;
            --text-sub: #b2a8d3;
            --border-color: #3b3258;
            
            /* アクセントポップカラー */
            --pop-red: #ff5376;
            --pop-yellow: #ffd15c;
            --pop-cyan: #00e5ff;
            --pop-purple: #a855f7;
            
            --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.35);
            --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.5);
            --glow-red: 0 0 15px rgba(255, 83, 118, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(255, 83, 118, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 20%, rgba(255, 209, 92, 0.10) 0%, transparent 45%),
                radial-gradient(circle at 50% 80%, rgba(0, 229, 255, 0.08) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            padding-top: 80px;
            min-height: 100vh;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: rgba(22, 19, 36, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 1000;
        }
        .nav-logo {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--pop-red);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            text-shadow: 0 0 10px rgba(255, 83, 118, 0.3);
        }
        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 800;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: var(--pop-yellow);
        }

        .container {
            max-width: 1040px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        .hero-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 0 0 36px 0;
            text-align: center;
            box-shadow: var(--shadow-md);
            margin-bottom: 30px;
            border: 2px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .hero-banner-container {
            width: 100%;
            height: 220px;
            background-color: var(--border-color);
            overflow: hidden;
            position: relative;
        }
        .hero-banner {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        .hero-body {
            padding: 0 24px;
        }

        .profile-icon {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            margin: -50px auto 16px;
            display: block;
            position: relative;
            z-index: 2;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 4px solid var(--card-bg);
            outline: 3px solid var(--pop-red);
            transition: transform 0.3s ease;
            background-color: var(--card-bg);
            user-select: none;
            -webkit-user-drag: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        .profile-icon:hover {
            transform: scale(1.05);
        }

        .hero-title {
            font-size: 2.1rem;
            font-weight: 900;
            margin-bottom: 6px;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }
        .hero-subtitle {
            font-size: 1.05rem;
            color: var(--pop-yellow);
            font-weight: 800;
            margin-bottom: 24px;
        }

        .sns-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
        }
        .sns-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.95rem;
            color: white;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-sm);
        }
        .sns-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        .sns-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .btn-yt { 
            background: linear-gradient(135deg, #ff5376 0%, #e0244d 100%); 
            box-shadow: 0 4px 15px rgba(255, 83, 118, 0.3);
        }
        .btn-nico { 
            background: linear-gradient(135deg, #3d3557 0%, #28213e 100%); 
            border: 1px solid var(--border-color);
        }
        .btn-x { 
            background: linear-gradient(135deg, #2a243d 0%, #161224 100%); 
            border: 1px solid var(--border-color);
        }

        .search-container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow-sm);
            border: 2px solid var(--border-color);
            margin-bottom: 30px;
            text-align: center;
        }
        .search-input {
            width: 100%;
            max-width: 450px;
            padding: 12px 20px;
            border-radius: 30px;
            border: 2px solid var(--border-color);
            font-size: 1rem;
            font-family: inherit;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            background-color: var(--bg-main);
        }
        .search-input::placeholder {
            color: #7b719c;
        }
        .search-input:focus {
            border-color: var(--pop-red);
            background-color: #1c182d;
            box-shadow: var(--glow-red);
        }
        .search-display {
            margin-top: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-sub);
            min-height: 24px;
        }
        .search-display span {
            color: var(--pop-yellow);
            text-decoration: underline;
        }

        .section-title {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--text-main);
            margin-top: 36px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 24px;
            background: linear-gradient(180deg, var(--pop-red), var(--pop-yellow));
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 83, 118, 0.5);
        }

        .scroll-wrapper {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 8px 4px 24px;
            scroll-behavior: smooth;
        }
        .scroll-wrapper::-webkit-scrollbar {
            height: 8px;
        }
        .scroll-wrapper::-webkit-scrollbar-track {
            background: var(--bg-main);
            border-radius: 10px;
        }
        .scroll-wrapper::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
        .scroll-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--pop-red);
        }

        .video-card {
            flex: 0 0 290px;
            background-color: var(--card-bg);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }
        .video-card:hover {
            transform: translateY(-5px);
            background-color: var(--card-bg-hover);
            box-shadow: var(--shadow-md);
            border-color: var(--pop-red);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            height: 165px;
            overflow: hidden;
            background-color: #000;
        }
        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
            opacity: 0.9;
        }
        .video-card:hover .thumbnail-container img {
            transform: scale(1.05);
            opacity: 1;
        }

        .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background-color: rgba(255, 83, 118, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }
        .play-icon::after {
            content: '';
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 8px 0 8px 14px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 3px;
        }
        .video-card:hover .play-icon {
            background-color: var(--pop-red);
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: var(--glow-red);
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .card-badge {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--pop-yellow);
            background-color: rgba(255, 209, 92, 0.12);
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 209, 92, 0.3);
        }
        .card-title {
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-main);
            line-height: 1.4;
        }
        .card-desc {
            font-size: 0.88rem;
            color: var(--text-sub);
            line-height: 1.5;
            font-weight: 600;
        }

        .no-results {
            padding: 20px;
            color: var(--text-sub);
            font-weight: 700;
        }

        footer {
            text-align: center;
            padding: 32px 16px;
            margin-top: 60px;
            background-color: var(--card-bg);
            border-top: 2px solid var(--border-color);
            color: var(--text-sub);
            font-size: 0.88rem;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="nav-logo">ララランド</a>
        <ul class="nav-links">
            <li><a href="#videos">動画一覧</a></li>
            <li><a href="#about">プロフィール</a></li>
        </ul>
    </nav>

    <div class="container">

        <section class="hero-card" id="about">
            <div class="hero-banner-container">
                <img src="bana-.jpg" alt="YouTubeチャンネルバナー" class="hero-banner" draggable="false" oncontextmenu="return false;">
            </div>

            <div class="hero-body">
                <img src="icon.jpg" alt="ララランドアイコン" class="profile-icon" draggable="false" oncontextmenu="return false;">
                <h1 class="hero-title">ララランド</h1>
                <p class="hero-subtitle">見ってってくれ～！</p>
                
                <div class="sns-grid">
                    <a href="https://www.youtube.com/channel/UCzJqo1AzojekLDx12fe2I3w" target="_blank" rel="noopener noreferrer" class="sns-btn btn-yt">
                        <svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                        YouTube
                    </a>

                    <a href="https://www.nicovideo.jp/my?cmnhd_ref=device%3Dpc%26site%3Dniconico%26pos%3Dheader%26page%3Dtop" target="_blank" rel="noopener noreferrer" class="sns-btn btn-nico">
                        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v3l4-3h9c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H11.2L9 18.7V17H3V5h18v12z"/></svg>
                        ニコニコ動画
                    </a>

                    <a href="https://x.com/G1ubvsIcps69070" target="_blank" rel="noopener noreferrer" class="sns-btn btn-x">
                        <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                        X (Twitter)
                    </a>
                </div>
            </div>
        </section>

        <!-- キーワード入力＆表示セクション -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="動画キーワードを入力..." oninput="handleSearch()">
            <div id="searchDisplay" class="search-display"></div>
        </div>

        <!-- 動画一覧アンカー -->
        <div id="videos"></div>

        <!-- 動画一覧エリア（Javascriptで動的に生成されます） -->
        <div id="default-sections"></div>

        <!-- 検索入力時に表示される検索結果セクション -->
        <div id="search-results-section" style="display: none;">
            <h2 class="section-title">検索結果</h2>
            <div class="scroll-wrapper" id="search-results-container"></div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 ララランド All Rights Reserved.</p>
    </footer>

    <script>
        // 動画データ一覧（復元完了）
        const allVideos = [
            {
                url: "https://youtu.be/X7lLWlGDaXQ",
                id: "X7lLWlGDaXQ",
                category: "影廊",
                title: "影廊 実況プレイ",
                desc: "恐怖の回廊に挑む実況動画です。"
            },
            {
                url: "https://youtu.be/sLycq_Q1kTs",
                id: "sLycq_Q1kTs",
                category: "マイクラ",
                title: "マインクラフト実況 Part1",
                desc: "マインクラフトの実況動画です。"
            },
            {
                url: "https://youtu.be/D1fevqDzlaQ",
                id: "D1fevqDzlaQ",
                category: "マイクラ",
                title: "マインクラフト実況 Part2",
                desc: "マインクラフトの実況動画です。"
            }
        ];

        function createCardHTML(video, badgeText) {
            return `
                <a href="${video.url}" target="_blank" rel="noopener noreferrer" class="video-card">
                    <div class="thumbnail-container">
                        <img src="https://i.ytimg.com/vi/${video.id}/hqdefault.jpg" alt="${video.title}" loading="lazy" draggable="false" oncontextmenu="return false;">
                        <div class="play-icon"></div>
                    </div>
                    <div class="card-body">
                        <span class="card-badge">${badgeText}</span>
                        <h3 class="card-title">${video.title}</h3>
                        <p class="card-desc">${video.desc}</p>
                    </div>
                </a>
            `;
        }

        function renderDefaultVideos() {
            const defaultSections = document.getElementById('default-sections');
            if (!defaultSections) return;

            if (allVideos.length === 0) {
                defaultSections.innerHTML = `
                    <h2 class="section-title">動画一覧</h2>
                    <div class="no-results" style="background: var(--card-bg); border-radius: 16px; border: 2px solid var(--border-color); text-align: center; padding: 40px 20px;">
                        現在公開中の動画はありません。更新をお楽しみに！
                    </div>
                `;
                return;
            }

            const categories = [...new Set(allVideos.map(v => v.category))];
            
            let html = `
                <h2 class="section-title">おすすめ動画</h2>
                <div class="scroll-wrapper" id="recommended-container"></div>
            `;

            categories.forEach((cat, index) => {
                html += `
                    <h2 class="section-title">${escapeHTML(cat)}</h2>
                    <div class="scroll-wrapper" id="cat-container-${index}"></div>
                `;
            });

            defaultSections.innerHTML = html;

            const recContainer = document.getElementById('recommended-container');
            if (recContainer) {
                const recList = [...allVideos].sort(() => 0.5 - Math.random()).slice(0, 2);
                recContainer.innerHTML = recList.map(v => createCardHTML(v, 'おすすめ')).join('');
            }

            categories.forEach((cat, index) => {
                const container = document.getElementById(`cat-container-${index}`);
                if (container) {
                    const list = allVideos.filter(v => v.category === cat);
                    container.innerHTML = list.map(v => createCardHTML(v, v.category)).join('');
                }
            });
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const displayEl = document.getElementById('searchDisplay');
            const defaultSections = document.getElementById('default-sections');
            const searchResultsSection = document.getElementById('search-results-section');
            const searchResultsContainer = document.getElementById('search-results-container');

            if (query === "") {
                displayEl.innerHTML = "";
                defaultSections.style.display = "block";
                searchResultsSection.style.display = "none";
            } else {
                displayEl.innerHTML = `「<span>${escapeHTML(query)}</span>」の検索結果`;
                defaultSections.style.display = "none";
                searchResultsSection.style.display = "block";

                const filtered = allVideos.filter(v => 
                    v.title.toLowerCase().includes(query.toLowerCase()) || 
                    v.desc.toLowerCase().includes(query.toLowerCase()) ||
                    v.category.toLowerCase().includes(query.toLowerCase())
                );

                if (filtered.length > 0) {
                    searchResultsContainer.innerHTML = filtered.map(v => createCardHTML(v, v.category)).join('');
                } else {
                    searchResultsContainer.innerHTML = '<div class="no-results">該当する動画が見つかりませんでした。</div>';
                }
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        document.addEventListener('DOMContentLoaded', () => renderDefaultVideos());
    </script>
</body>
</html>
