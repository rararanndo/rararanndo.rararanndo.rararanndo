<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆっくり実況チャンネル</title>
    <style>
        /* 全体の基本設定 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #ff4757;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        
        /* SNSボタン */
        .sns-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .btn-youtube { background-color: #FF0000; }
        .btn-x { background-color: #000000; border: 1px solid #444; }

        /* ゲームごとのグループ（セクション） */
        .video-section {
            width: 100%;
            max-width: 1000px;
            margin-top: 35px;
        }

        /* ゲームタイトルの見出し */
        .section-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00d2d3;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid #00d2d3;
        }

        /* 横スクロールする動画エリア */
        .video-scroll-container {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 15px; /* スクロールバーとの隙間 */
            scroll-behavior: smooth;
        }

        /* スクロールバーのデザインを綺麗にする */
        .video-scroll-container::-webkit-scrollbar {
            height: 8px;
        }
        .video-scroll-container::-webkit-scrollbar-track {
            background: #1e1e1e;
            border-radius: 4px;
        }
        .video-scroll-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        .video-scroll-container::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        /* 動画カードの固定幅設定 */
        .card {
            flex: 0 0 280px; /* 横スクロールするために幅を固定 */
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }
        .card iframe {
            width: 100%;
            height: 160px;
            border: none;
        }
        .card-content {
            padding: 15px;
        }
        .card-title {
            font-size: 1rem;
            font-weight: bold;
            margin: 0 0 8px 0;
            color: #fff;
        }
        .card-desc {
            font-size: 0.85rem;
            color: #888;
            margin: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <h1>〇〇のゆっくり実況部屋</h1>
        <p class="subtitle">ゆっくり実況動画を投稿しています！おすすめ動画をまとめました。</p>
        
        <div class="sns-container">
            <a href="https://youtube.com" target="_blank" class="btn btn-youtube">YouTubeチャンネル</a>
            <a href="https://x.com" target="_blank" class="btn btn-x">X (Twitter)</a>
        </div>
    </header>

    <!-- 【列1】ゲームタイトルAの実況まとめ -->
    <div class="video-section">
        <h2 class="section-title">🎮 マインクラフト実況シリーズ</h2>
        <div class="video-scroll-container">
            
            <div class="card">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                <div class="card-content">
                    <p class="card-title">【マイクラ】パート1</p>
                    <p class="card-desc">サバイバル生活のはじまり！</p>
                </div>
            </div>

            <div class="card">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                <div class="card-content">
                    <p class="card-title">【マイクラ】パート2</p>
                    <p class="card-desc">巨大な拠点を建設するぞ！</p>
                </div>
            </div>

            <div class="card">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                <div class="card-content">
                    <p class="card-title">【マイクラ】パート3</p>
                    <p class="card-desc">ネザーに突入してみた結果...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- 【列2】ゲームタイトルBの実況まとめ（下に新しい列を追加する例） -->
    <div class="video-section">
        <h2 class="section-title">⚔️ モンスターハンター実況シリーズ</h2>
        <div class="video-scroll-container">
            
            <div class="card">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                <div class="card-content">
                    <p class="card-title">【モンハン】パート1</p>
                    <p class="card-desc">武器選びから解説します！</p>
                </div>
            </div>

            <div class="card">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                <div class="card-content">
                    <p class="card-title">【モンハン】パート2</p>
                    <p class="card-desc">緊急クエスト挑戦！</p>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
