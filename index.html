<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゆっくり実況チャンネル</title>
    <style>
        /* 全体のデザイン設定 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #ff4757;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 20px;
        }
        
        /* SNSボタン */
        .sns-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .btn-youtube { background-color: #FF0000; }
        .btn-x { background-color: #000000; border: 1px solid #444; }

        /* 動画カードの一覧レイアウト */
        .video-grid {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }
        .card iframe {
            width: 100%;
            height: 180px;
            border: none;
        }
        .card-content {
            padding: 15px;
        }
        .card-title {
            font-size: 1.05rem;
            font-weight: bold;
            margin: 0 0 8px 0;
            color: #fff;
        }
        .card-desc {
            font-size: 0.85rem;
            color: #888;
            margin: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <header>
        <h1>〇〇のゆっくり実況部屋</h1>
        <p class="subtitle">ゆっくり実況動画を投稿しています！おすすめ動画をまとめました。</p>
        
        <div class="sns-container">
            <a href="https://youtube.com" target="_blank" class="btn btn-youtube">YouTubeチャンネル</a>
            <a href="https://x.com" target="_blank" class="btn btn-x">X (Twitter)</a>
        </div>
    </header>

    <div class="video-grid">
        <!-- 動画1 -->
        <div class="card">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
            <div class="card-content">
                <p class="card-title">【ゆっくり実況】おすすめ動画 その1</p>
                <p class="card-desc">動画の見どころや、どんなゲームの実況かなどの簡単な紹介文を書きます。</p>
            </div>
        </div>

        <!-- 動画2 -->
        <div class="card">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
            <div class="card-content">
                <p class="card-title">【ゆっくり実況】おすすめ動画 その2</p>
                <p class="card-desc">ここにも動画の説明を入力できます。</p>
            </div>
        </div>
    </div>

</body>
</html>
